<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Thêm/Sửa Coupon - SweetCake')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-primary" th:text="${coupon.id == null ? 'Thêm mã giảm giá mới' : 'Chỉnh sửa mã'}">Coupon</h2>
                        <hr>
                        
                        <form th:action="@{/admin/coupons/save}" th:object="${coupon}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mã CODE</label>
                                <input type="text" class="form-control" th:field="*{code}" placeholder="Ví dụ: GIAMGIA50" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">Lỗi</div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Loại giảm giá</label>
                                    <select class="form-select" th:field="*{type}">
                                        <option value="PERCENTAGE">Phần trăm (%)</option>
                                        <option value="FIXED_AMOUNT">Số tiền cố định (đ)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Giá trị</label>
                                    <input type="number" class="form-control" th:field="*{value}" th:classappend="${#fields.hasErrors('value')} ? 'is-invalid'" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('value')}" th:errors="*{value}">Lỗi</div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Đơn hàng tối thiểu để áp dụng (đ)</label>
                                <input type="number" class="form-control" th:field="*{minOrderAmount}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Ngày hết hạn</label>
                                <input type="date" class="form-control" th:field="*{expiryDate}">
                            </div>

                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}" id="active">
                                    <label class="form-check-label" for="active">Kích hoạt mã</label>
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary px-4">Lưu mã</button>
                                <a href="/admin/coupons" class="btn btn-outline-secondary">Hủy bỏ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
