<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Chi tiết đơn hàng - Admin')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <!-- Toast Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show no-print" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show no-print" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row mb-4">
            <div class="col-md-8">
                <h2 class="fw-bold"><i class="fas fa-file-invoice me-2"></i>Chi tiết đơn hàng <span th:text="'#' + ${order.id}"></span></h2>
                <p class="text-muted" th:text="'Đặt ngày: ' + ${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></p>
            </div>
            <div class="col-md-4 text-end no-print">
                <button class="btn btn-outline-dark me-2" onclick="window.print()"><i class="fas fa-print me-2"></i>In hóa đơn</button>
                <a href="/admin/orders" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Quay lại</a>
            </div>
        </div>

        <div class="row">
            <!-- Order Status & Items -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Sản phẩm đã đặt</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-borderless align-middle">
                                <thead>
                                    <tr class="text-muted small border-bottom">
                                        <th>Sản phẩm</th>
                                        <th>Giá</th>
                                        <th>Số lượng</th>
                                        <th class="text-end">Tổng</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="detail : ${order.orderDetails}" class="border-bottom">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <img th:src="${detail.product.imageUrl ?: 'https://via.placeholder.com/40x40'}" class="rounded me-3" style="width: 40px; height: 40px; object-fit: cover;">
                                                <div>
                                                    <div th:text="${detail.product.name}">Bánh</div>
                                                    <small class="text-muted" th:if="${detail.flavor != null}" th:text="'Vị: ' + ${detail.flavor}"></small>
                                                </div>
                                            </div>
                                        </td>
                                        <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">0</td>
                                        <td th:text="'x' + ${detail.quantity}">x1</td>
                                        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 0, 'COMMA', 0, 'POINT') + ' đ'}">0</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3" class="text-end pt-4 h5">Tổng cộng:</td>
                                        <td class="text-end pt-4 h5 fw-bold text-primary" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}">0</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Customer & Status Management -->
            <div class="col-md-4 no-print">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Trạng thái đơn hàng</h5>
                    </div>
                    <div class="card-body">
                        <!-- If order is PENDING, CONFIRMED, or SHIPPING, show update form -->
                        <form th:if="${order.status.name() != 'DELIVERED' && order.status.name() != 'CANCELLED'}" 
                              th:action="@{/admin/orders/update-status}" method="post">
                            <input type="hidden" name="orderId" th:value="${order.id}">
                            <div class="mb-3">
                                <label class="form-label small text-muted">Thay đổi trạng thái:</label>
                                <select class="form-select mb-3" name="status">
                                    <option th:each="s : ${T(com.example.DoanJava.model.Order.OrderStatus).values()}" 
                                            th:value="${s}" 
                                            th:text="${s}"
                                            th:selected="${s == order.status}">STATUS</option>
                                </select>
                                <button type="submit" class="btn btn-primary w-100 mb-2">Cập nhật trạng thái</button>
                            </div>
                        </form>

                        <!-- If order is DELIVERED or CANCELLED, show current status and delete button -->
                        <div th:if="${order.status.name() == 'DELIVERED' || order.status.name() == 'CANCELLED'}">
                            <div class="text-center mb-4 p-3 border rounded">
                                <span class="d-block mb-2 text-muted small">Trạng thái hiện tại:</span>
                                <span class="badge h5 p-2" 
                                      th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : 'bg-danger'}"
                                      th:text="${order.status}">STATUS</span>
                                <p class="small text-muted mt-2">Đơn hàng này đã kết thúc và không thể đổi trạng thái.</p>
                            </div>
                            <a th:href="@{/admin/orders/delete/{id}(id=${order.id})}" 
                               class="btn btn-outline-danger w-100"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa đơn hàng này khỏi lịch sử?')">
                               <i class="fas fa-trash me-2"></i>Xóa đơn hàng
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Thông tin khách hàng</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-1 fw-bold" th:text="${order.customerName}">Tên</p>
                        <p class="mb-1 text-muted"><i class="fas fa-phone me-2"></i><span th:text="${order.phoneNumber}">SĐT</span></p>
                        <p class="mb-1 text-muted"><i class="fas fa-envelope me-2"></i><span th:text="${order.email}">Email</span></p>
                        <hr>
                        <h6>Địa chỉ giao hàng:</h6>
                        <p class="text-muted" th:text="${order.shippingAddress}">Địa chỉ</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @media print {
            .no-print, .navbar, footer { display: none !important; }
            .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .card { border: 1px solid #ddd !important; box-shadow: none !important; }
        }
    </style>
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
