<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Quản lý Đơn hàng - SweetCake')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <!-- Toast Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <h2 class="fw-bold mb-4"><i class="fas fa-clipboard-list me-2"></i>Quản lý Đơn hàng</h2>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Mã đơn</th>
                            <th>Ngày đặt</th>
                            <th>Khách hàng</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="ps-4 fw-bold" th:text="'#' + ${order.id}">#1</td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">01/01</td>
                            <td th:text="${order.customerName}">Khách</td>
                            <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : (order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning')}"
                                      th:text="${order.status}">PENDING</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary me-2">
                                    <i class="fas fa-eye me-1"></i> Chi tiết
                                </a>
                                <a th:if="${order.status.name() == 'DELIVERED' || order.status.name() == 'CANCELLED'}" 
                                   th:href="@{/admin/orders/delete/{id}(id=${order.id})}" 
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa đơn hàng này khỏi lịch sử?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin" class="btn btn-link text-decoration-none px-0"><i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard</a>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
