<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Quản lý Sản phẩm - SweetCake')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <!-- Toast Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-box me-2"></i>Quản lý Sản phẩm</h2>
            <a href="/admin/products/add" class="btn btn-primary"><i class="fas fa-plus me-2"></i>Thêm sản phẩm mới</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá gốc</th>
                            <th>Giá giảm</th>
                            <th>Kho</th>
                            <th>Nổi bật</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td class="ps-4">
                                <img th:src="${p.imageUrl ?: 'https://via.placeholder.com/50x50'}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                            </td>
                            <td th:text="${p.name}" class="fw-bold">Tên</td>
                            <td th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}">Danh mục</td>
                            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">Giá</td>
                            <td th:text="${p.discountPrice != null ? #numbers.formatDecimal(p.discountPrice, 0, 'COMMA', 0, 'POINT') + ' đ' : '-'}">-</td>
                            <td>
                                <span class="badge" th:classappend="${p.stock < 5 ? 'bg-danger' : 'bg-info'}" th:text="${p.stock}">0</span>
                            </td>
                            <td>
                                <i class="fas fa-star text-warning" th:if="${p.featured}"></i>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info me-2">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/admin/products/delete/{id}(id=${p.id})}" 
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin" class="btn btn-link text-decoration-none px-0"><i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard</a>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
