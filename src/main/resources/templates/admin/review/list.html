<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Quản lý Đánh giá - SweetCake')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <h2 class="fw-bold mb-4"><i class="fas fa-star me-2"></i>Quản lý Đánh giá</h2>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Sản phẩm</th>
                            <th>Khách hàng</th>
                            <th>Đánh giá</th>
                            <th>Nội dung</th>
                            <th>Ngày</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reviews}">
                            <td class="ps-4" th:text="${r.product.name}">Bánh</td>
                            <td th:text="${r.user.username}">User</td>
                            <td>
                                <span class="text-warning">
                                    <!-- Full Stars -->
                                    <span th:if="${r.rating >= 1}">
                                        <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, T(java.lang.Math).floor(r.rating).intValue())}"></i>
                                    </span>
                                    <!-- Half Star -->
                                    <i class="fas fa-star-half-alt" th:if="${r.rating % 1 != 0}"></i>
                                    <!-- Empty Stars -->
                                    <span th:if="${r.rating <= 4}">
                                        <i class="far fa-star" th:each="i : ${#numbers.sequence(1, (5 - T(java.lang.Math).ceil(r.rating)).intValue())}"></i>
                                    </span>
                                </span>
                            </td>
                            <td th:text="${r.content}" style="max-width: 300px;" class="text-truncate">Nội dung</td>
                            <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy')}">Date</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/reviews/delete/{id}(id=${r.id})}" 
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Xóa đánh giá này?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin" class="btn btn-link text-decoration-none px-0"><i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard</a>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
