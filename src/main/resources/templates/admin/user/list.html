<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Quản lý Người dùng - SweetCake')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <h2 class="fw-bold mb-4"><i class="fas fa-user-friends me-2"></i>Quản lý Người dùng</h2>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Username</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="ps-4 fw-bold" th:text="${u.username}">admin</td>
                            <td th:text="${u.fullName}">Admin</td>
                            <td th:text="${u.email}">admin@gmail.com</td>
                            <td>
                                <span th:each="role : ${u.roles}" class="badge bg-secondary me-1" th:text="${role.name}">ROLE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${u.enabled ? 'bg-success' : 'bg-danger'}" 
                                      th:text="${u.enabled ? 'Hoạt động' : 'Đang khóa'}">Active</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/users/toggle/{id}(id=${u.id})}" 
                                   class="btn btn-sm" 
                                   th:classappend="${u.enabled ? 'btn-outline-danger' : 'btn-outline-success'}">
                                    <i class="fas" th:classappend="${u.enabled ? 'fa-user-slash' : 'fa-user-check'}"></i>
                                    <span th:text="${u.enabled ? 'Khóa' : 'Mở khóa'}"></span>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin" class="btn btn-link text-decoration-none px-0"><i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard</a>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
