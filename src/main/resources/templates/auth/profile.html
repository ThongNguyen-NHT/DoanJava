<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Hồ sơ cá nhân - SweetCake')}"></head>
<body class="bg-light">
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-body p-5">
                        <h2 class="mb-4"><i class="fas fa-id-card me-2 text-primary"></i>Thông tin tài khoản</h2>
                        <hr class="mb-4">

                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/profile/update}" th:object="${user}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Tên đăng nhập</label>
                                    <input type="text" class="form-control bg-light" th:field="*{username}" readonly>
                                    <small class="text-muted">Không thể thay đổi tên đăng nhập.</small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fullName" class="form-label fw-bold">Họ và tên</label>
                                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Lỗi</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label fw-bold">Số điện thoại</label>
                                    <input type="text" class="form-control" id="phone" th:field="*{phone}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Lỗi</div>
                                </div>
                                <div class="col-md-12 mb-4">
                                    <label for="address" class="form-label fw-bold">Địa chỉ nhận hàng</label>
                                    <textarea class="form-control" id="address" th:field="*{address}" rows="3" required></textarea>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Lỗi</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end">
                                <a href="/" class="btn btn-outline-secondary px-4">Quay lại</a>
                                <button type="submit" class="btn btn-primary px-5">Lưu thay đổi</button>
                            </div>
                        </form>

                        <hr class="my-5">

                        <h2 id="changePasswordSection" class="mb-4 text-danger"><i class="fas fa-key me-2"></i>Đổi mật khẩu</h2>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/profile/change-password}" th:object="${changePasswordRequest}" method="post">
                            <div class="row g-3">
                                <div class="col-md-12 mb-3">
                                    <label for="oldPassword" class="form-label fw-bold">Mật khẩu hiện tại</label>
                                    <input type="password" class="form-control" id="oldPassword" th:field="*{oldPassword}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}">Lỗi</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="newPassword" class="form-label fw-bold">Mật khẩu mới</label>
                                    <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Lỗi</div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="confirmPassword" class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Lỗi</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-danger px-5">Cập nhật mật khẩu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
