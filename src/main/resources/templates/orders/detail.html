<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Chi tiết đơn hàng - SweetCake')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Đơn hàng <span th:text="'#' + ${order.id}"></span></h2>
            <a href="/orders" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Quay lại danh sách</a>
        </div>

        <div class="row">
            <!-- Order Items -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Sản phẩm đã mua</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Sản phẩm</th>
                                    <th>Giá mua</th>
                                    <th>Số lượng</th>
                                    <th class="text-end pe-4">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${order.orderDetails}">
                                    <td class="ps-4">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${detail.product.imageUrl ?: 'https://via.placeholder.com/50x50'}" class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
                                            <div>
                                                <div class="fw-bold" th:text="${detail.product.name}">Bánh</div>
                                                <small class="text-muted" th:if="${detail.flavor != null}" th:text="'Vị: ' + ${detail.flavor}"></small>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">0</td>
                                    <td th:text="'x' + ${detail.quantity}">x1</td>
                                    <td class="text-end pe-4 fw-bold text-primary" th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 0, 'COMMA', 0, 'POINT') + ' đ'}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Summary & Info -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Thông tin đơn hàng</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Trạng thái:</span>
                            <span class="badge" 
                                  th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : (order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning')}"
                                  th:text="${order.status}">PENDING</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Ngày đặt:</span>
                            <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">Date</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="h5 fw-bold mb-0">Tổng thanh toán:</span>
                            <span class="h5 fw-bold text-primary mb-0" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</span>
                        </div>
                        
                        <div th:if="${order.status.name() == 'PENDING'}" class="mt-4">
                            <a th:href="@{/orders/cancel/{id}(id=${order.id})}" 
                               class="btn btn-outline-danger w-100"
                               onclick="return confirm('Bạn có chắc chắn muốn hủy đơn hàng này?')">Hủy đơn hàng</a>
                            <p class="small text-muted text-center mt-2">Bạn chỉ có thể hủy khi đơn hàng đang chờ duyệt.</p>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Thông tin giao hàng</h5>
                        <p class="mb-1 fw-bold" th:text="${order.customerName}">Tên</p>
                        <p class="mb-1 text-muted"><i class="fas fa-phone me-2"></i><span th:text="${order.phoneNumber}">SĐT</span></p>
                        <p class="mb-3 text-muted"><i class="fas fa-envelope me-2"></i><span th:text="${order.email}">Email</span></p>
                        <h6 class="small fw-bold text-uppercase text-muted">Địa chỉ nhận hàng:</h6>
                        <p class="small mb-0" th:text="${order.shippingAddress}">Address</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
